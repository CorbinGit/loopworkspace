name: Build Loop unsigned (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ipa:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out official LoopWorkspace with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Confirm Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build unsigned Loop app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace LoopWorkspace.xcworkspace \
            -scheme LoopWorkspace \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA for inspection and local signing
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/DerivedData/Build/Products/Release-iphoneos/Loop.app"
          if [[ ! -d "$app" ]]; then
            echo 'Loop.app not found at expected output path.' >&2
            find DerivedData/Build/Products -maxdepth 3 -name '*.app' -print
            exit 1
          fi
          mkdir -p package/Payload
          ditto "$app" package/Payload/Loop.app
          (cd package && zip -qry ../Loop-unsigned.ipa Payload)
          unzip -t Loop-unsigned.ipa | tail -n 2

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loop-unsigned-build
          path: |
            Loop-unsigned.ipa
            build.log
          if-no-files-found: warn
